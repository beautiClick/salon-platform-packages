name: CI and Release

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default: every job can only read the code.
# The release job below asks for more, and only it gets more.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A newer push to the same branch cancels this older, now-useless check.
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json,
      # so local and CI always use the same pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails if pnpm-lock.yaml is out of date, so CI installs exactly
      # what you tested locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  release:
    # Release can only start if verify passed. If verify fails, this job is skipped.
    needs: verify
    # Only on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two releases at once, and never cancel one halfway through publishing.
    concurrency:
      group: release
      cancel-in-progress: false
    # Release needs more power than verify: push a "Version Packages" branch,
    # open a PR, and publish to GitHub Packages.
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # setup-node writes an .npmrc that reads the token from NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: '@beauticlick'

      - run: pnpm install --frozen-lockfile

      # Two modes, decided by whether unreleased changesets exist:
      #  1. Changesets found   -> open or update a "Version Packages" PR.
      #  2. That PR was merged -> run the publish script (build + publish).
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
